name: adonisjs-packages

services:
  pgsql:
    image: postgres:18-alpine
    container_name: adonisjs_packages_pgsql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playground
    ports:
      - '55432:5432'
    volumes:
      - pgsql:/var/lib/postgresql
      - ./docker/pgsql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d playground_test']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgsql:
